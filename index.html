<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="复杂系统、群体行为与智能体研究的多维分类文献库。">
  <title>城市复杂系统文献库</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <meta name="catalog-version" content="60f405a918e50b34435fd1fdebb710f61cc9a3063c2a02253533a6db8befa82c">
  <meta name="table-version" content="005cba604233e9f74828518eb91983ee17dc9b06bd80588d1b83b6b3284e9f87">
  <meta name="reading-version" content="1355de01cae64f77651fb84372158688da190e1ac6c3b68eff5e519080ed64f4">
  <link rel="stylesheet" href="assets/style.css?v=fafbd14541b553366035742f49e0a3f6ef2597068d4eb25094e4dde4e606474c">
  <script src="assets/app.js?v=fafbd14541b553366035742f49e0a3f6ef2597068d4eb25094e4dde4e606474c" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#papers">跳到论文表格</a>
  <main class="page-width">
    <h1 class="sr-only">城市复杂系统文献库</h1>
    <div class="toolbar">
      <label class="search-box"><span class="sr-only">检索文献</span><input id="search" type="search" placeholder="搜索论文、作者、关键词或 DOI" autocomplete="off"><button id="clear-search" type="button" hidden aria-label="清空检索">清空</button></label>
      <p id="total-count" class="total-count"></p>
    </div>
    <p id="load-status" role="status">正在载入文献…</p>
    <p id="result-count" class="sr-only" aria-live="polite"></p>
    <div id="papers" class="table-scroll" role="region" aria-label="文献表格" tabindex="0">
      <table class="paper-table">
        <caption class="sr-only">全部文献，按年份倒序、同年按英文引用键排序</caption>
        <colgroup><col class="col-direction"><col class="col-keywords"><col class="col-question"><col class="col-journal"><col class="col-year"><col class="col-title"><col class="col-links"></colgroup>
        <thead>
          <tr>
            <th scope="col"><button class="column-filter" data-column="topic" aria-haspopup="dialog" aria-expanded="false">研究方向</button></th>
            <th scope="col"><button class="column-filter" data-column="keyword" aria-haspopup="dialog" aria-expanded="false">关键词</button></th>
            <th scope="col">研究问题</th>
            <th scope="col"><button class="column-filter" data-column="journal" aria-haspopup="dialog" aria-expanded="false">期刊</button></th>
            <th scope="col"><button class="column-filter" data-column="year" aria-haspopup="dialog" aria-expanded="false">年份</button></th>
            <th scope="col">论文名称</th>
            <th scope="col"><button class="column-filter" data-column="hasReading" aria-haspopup="dialog" aria-expanded="false">链接</button></th>
          </tr>
          <tr id="filter-summary" hidden><td colspan="7"><div class="filter-summary"><div id="active-filters"></div><button id="clear-filters" type="button">清除筛选</button></div></td></tr>
        </thead>
        <tbody id="paper-rows"></tbody>
      </table>
      <div id="empty" class="empty-state" hidden><p>没有匹配的文献</p><button id="reset-filter" type="button">清除筛选</button></div>
    </div>
  </main>
  <div id="filter-panel" class="filter-panel" role="dialog" aria-labelledby="filter-title" hidden>
    <div class="filter-panel-heading"><h2 id="filter-title"></h2><button id="close-filter" type="button" aria-label="关闭筛选">×</button></div>
    <input id="filter-search" type="search" aria-label="搜索筛选选项" placeholder="搜索选项" autocomplete="off">
    <div id="filter-options" class="filter-options"></div>
    <div id="year-filter" hidden>
      <div class="year-values"><label>起始年份<input id="year-from" type="number" inputmode="numeric" step="1"></label><span>—</span><label>结束年份<input id="year-to" type="number" inputmode="numeric" step="1"></label></div>
      <div id="year-slider" class="year-slider"><div class="year-track"><span id="year-selection"></span></div><input id="year-lower" type="range" step="1" aria-label="起始年份滑块"><input id="year-upper" type="range" step="1" aria-label="结束年份滑块"></div>
    </div>
    <button id="clear-column" type="button">清除此列筛选</button>
  </div>
  <div id="journal-tooltip" class="journal-tooltip" role="tooltip" hidden></div>
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="paper-card" class="paper-card" role="dialog" aria-labelledby="card-title" hidden>
    <div class="card-top"><span id="card-direction"></span><button id="close-card" type="button" aria-label="关闭论文详情">×</button></div>
    <div class="card-scroll"><div id="card-metadata"><h2 id="card-title"></h2><p id="card-authors" class="card-authors"></p><p id="card-publication" class="card-publication"></p><section class="card-question"><h3>研究问题</h3><p id="card-question"></p></section></div><article id="card-reading" class="reading-body" hidden></article><p id="card-status" role="status" hidden></p><button id="retry-card" type="button" hidden>重试</button></div>
    <div class="card-footer"><div id="card-links" class="resource-links"></div><button id="copy-link" type="button">复制链接</button><span id="copy-status" class="sr-only" role="status"></span></div>
  </aside>
  <noscript><p class="page-width">请启用 JavaScript 以筛选文献和浏览论文详情。</p></noscript>
</body>
</html>
